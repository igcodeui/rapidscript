<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapid Relief — Guided Interactive Script</title>
<style>
:root{--navy:#10263b;--navy2:#17364f;--navy3:#244b65;--teal:#2bb7a5;--teal-soft:#e8f7f4;--ink:#1d3345;--muted:#718596;--line:#dbe5eb;--paper:#f2f6f8;--white:#fff;--shadow:0 18px 48px rgba(16,38,59,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--paper)}button{font:inherit;cursor:pointer}
.topbar{height:76px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,44px);box-shadow:0 4px 18px rgba(16,38,59,.16)}
.brand{display:flex;align-items:center;gap:12px}.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#39c5b2,#167e83);display:grid;place-items:center;font-weight:900;letter-spacing:-1px}.brand-name{font-size:17px;font-weight:800;line-height:1.15}.brand-sub{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#a9bfce;margin-top:4px}
.reset{border:1px solid #58758a;color:#fff;background:#1b3b54;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:800}.reset:hover{background:#294e68}
main{width:min(900px,calc(100% - 32px));margin:38px auto 56px}.intro{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:0 4px 18px}.eyebrow{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:#718696;font-weight:850}.intro h1{font-size:26px;letter-spacing:-.6px;color:var(--navy);margin:5px 0 0}.step-chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#557083;padding:7px 11px;border-radius:30px;font-size:11px;font-weight:750}
.progress{height:5px;background:#dce6eb;border-radius:20px;overflow:hidden;margin:0 4px 22px}.progress-fill{height:100%;width:0;background:var(--teal);border-radius:20px;transition:width .2s ease}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.card-top{padding:18px 24px 14px;border-bottom:1px solid #edf1f4;display:flex;align-items:center;justify-content:space-between;gap:12px}.stage{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#6b8495;font-weight:850}.speaker{border-radius:6px;background:#e6f6f2;color:#14766c;padding:5px 8px;font-size:9px;letter-spacing:1px;font-weight:900}
.script-body{padding:clamp(24px,5vw,48px);min-height:260px;display:flex;flex-direction:column;justify-content:center}.prompt{font-size:clamp(20px,3vw,27px);line-height:1.55;letter-spacing:-.35px;color:#18344a;font-weight:560;white-space:pre-line}.client-line{border-left:3px solid #9eafba;background:#f5f8fa;padding:12px 15px;border-radius:0 9px 9px 0;margin-top:24px;color:#62798a;font-size:14px}.client-line b{display:block;font-size:9px;letter-spacing:1.2px;color:#8295a2;margin-bottom:4px}
.actions{padding:20px 24px 24px;background:#f8fafb;border-top:1px solid #edf1f4}.action-label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;font-weight:850;color:#78909f;margin:0 0 11px}.choices{display:flex;flex-wrap:wrap;gap:10px}.choice{min-height:46px;padding:11px 17px;border:1px solid #cbd9e1;background:#fff;color:#24465d;border-radius:10px;font-size:13px;font-weight:800;transition:.15s}.choice:hover{border-color:var(--teal);background:#eef9f7;transform:translateY(-1px)}.choice.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.choice.primary:hover{background:#204761}.choice.positive{border-color:#a9dcd2;background:#eff9f6;color:#176c61}.choice.warning{border-color:#e3d3b2;background:#fffaf0;color:#72541e}
.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px}.back{border:1px solid #cbd9e1;background:#fff;color:#37566b;border-radius:9px;padding:10px 15px;font-size:12px;font-weight:800}.back:disabled{opacity:.35;cursor:not-allowed}.hint{font-size:11px;color:#8294a0;text-align:right}
.done{text-align:center;padding:34px 22px 38px}.done-icon{width:48px;height:48px;border-radius:50%;background:var(--teal-soft);color:#138477;display:grid;place-items:center;font-size:24px;font-weight:900;margin:0 auto 14px}.done h2{margin:0;color:var(--navy);font-size:23px}.done p{margin:8px 0 22px;color:#728696;font-size:13px}.hidden{display:none!important}
@media(max-width:600px){.topbar{height:68px;padding:0 14px}.mark{width:35px;height:35px}.brand-name{font-size:15px}.reset{padding:9px 10px;font-size:11px}main{margin:24px auto 32px}.intro h1{font-size:22px}.intro{align-items:start;flex-direction:column;gap:8px}.step-chip{align-self:flex-start}.card{border-radius:15px}.card-top{padding:15px 17px}.script-body{min-height:230px;padding:25px 20px}.prompt{font-size:21px}.actions{padding:17px}.choices{display:grid;grid-template-columns:1fr}.choice{width:100%;text-align:left}.footer{position:sticky;bottom:8px;background:rgba(242,246,248,.95);padding:8px 0;backdrop-filter:blur(8px)}.hint{max-width:65%}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="mark">RR</div><div><div class="brand-name">Rapid Relief</div><div class="brand-sub">Guided Interactive Script</div></div></div>
  <button class="reset" id="resetCall" type="button">↺ Start New Call</button>
</header>
<main>
  <div class="intro">
    <div><div class="eyebrow">Agent call flow</div><h1 id="pageTitle">Opening & Verification</h1></div>
    <div class="step-chip" id="stepChip">Opening · Step 1</div>
  </div>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  <section class="card" id="scriptCard" aria-live="polite">
    <div class="card-top"><div class="stage" id="stageName">Opening & Verification</div><div class="speaker" id="speaker">AGENT</div></div>
    <div class="script-body"><div class="prompt" id="promptText"></div><div class="client-line hidden" id="clientLine"><b>CLIENT</b><span id="clientText"></span></div></div>
    <div class="actions"><div class="action-label" id="actionLabel">Select the client's response</div><div class="choices" id="choices"></div></div>
  </section>
  <section class="card done hidden" id="doneCard" aria-live="polite">
    <div class="done-icon">✓</div><h2 id="doneTitle">Transfer Script</h2><p id="doneText">The current script portion is complete.</p><button class="choice primary" id="doneReset" type="button">Start New Call</button>
  </section>
  <div class="footer"><button class="back" id="backButton" type="button" disabled>← Previous</button><div class="hint">Only the current screening prompt is shown.</div></div>
</main>
<script>
(function(){
  const steps={
    name:{stage:'Opening & Verification',title:'Opening & Verification',speaker:'AGENT',text:'Hi! Am I speaking with (Client Name)?',client:'Yes.',actions:[['Client says Yes','hear','primary']]},
    hear:{stage:'Opening & Verification',title:'Opening & Verification',speaker:'AGENT',text:'Wonderful! Hi, (Client Name)! Can you hear me clearly on your end?',client:'Yes.',actions:[['Client says Yes','intro','primary']]},
    intro:{stage:'Opening & Verification',title:'Opening & Verification',text:"Perfect! Thank you. My name is (Agent Name), and I'm calling from Rapid Relief.",next:'introReason'},
    introReason:{stage:'Opening & Verification',title:'Opening & Verification',text:"I understand you are trying to explore financial hardship assistance and available resources for you and your family.\n\nThere are government programs and assistance that are available in your area. I just need to verify some information before I transfer you over to your case manager who will assist in checking your eligibility for the monthly assistance program of up to $4100.\n\nLet’s begin with your state.",next:'state'},
    state:{stage:'Opening & Verification',title:'Opening & Verification',text:'You are in ( state) is this correct?',next:'phone'},
    phone:{stage:'Opening & Verification',title:'Opening & Verification',text:'In case we get disconnected I have this number ( phone ) on file.',next:'phoneConfirm'},
    phoneConfirm:{stage:'Opening & Verification',title:'Opening & Verification',text:'Do you want us to call you on this number or is there any other number you want us to add on your file?',next:'age'},
    age:{stage:'Opening & Verification',title:'Opening & Verification',text:'Great! And I have your age as ( age), is that correct?',next:'status'},
    status:{stage:'Opening & Verification',title:'Opening & Verification',text:'Ok, Are you currently working or receiving any Social Security Disability or Income benefits?',actions:[['Already has SSDI — Proceed to TTW','ttw','primary'],['Working','workType'],['Not working','disabilityCheck']]},
    workType:{stage:'Opening & Verification',title:'Opening & Verification',text:'IF WORKING: Are you currently working full time or part-time?',actions:[['Full time working — Proceed to Debt Script','debtIntro','primary'],['Part-time working','partTimeRestricted'],['Not working','notWorkingRestricted']]},
    partTimeRestricted:{stage:'Disability Screening',title:'Disability Screening',text:'WORKING PART TIME or NOT WORKING: Are you restricted in any way from working due to a disability?',actions:[['YES','partTimeIncome','primary'],['NO — Continue','pendingClaim']]},
    notWorkingRestricted:{stage:'Disability Screening',title:'Disability Screening',text:'WORKING PART TIME or NOT WORKING: Are you restricted in any way from working due to a disability?',actions:[['YES','notWorkingIncome','primary'],['NO — Continue','pendingClaim']]},
    partTimeIncome:{stage:'Disability Screening',title:'Disability Screening',text:'Are you making $1,700 or less monthly?',actions:[['$1,700 or less — Proceed to Screening','pendingClaim','primary'],['More than $1,700 — Proceed to Debt','debtIntro']]},
    notWorkingIncome:{stage:'Disability Screening',title:'Disability Screening',text:'Are you making $1,700 or less monthly?',actions:[['$1,700 or less — Proceed to Screening','notWorkingLine','primary'],['More than $1,700 — Proceed to Debt','debtIntro']]},
    notWorkingLine:{stage:'Disability Screening',title:'Disability Screening',text:'Ok, no worries, we will take care of that. You are a great candidate for up to $4100 Disability Benefit.',next:'pendingClaim'},
    pendingClaim:{stage:'Disability Screening',title:'Disability Screening',text:'Have you ever applied for or have any pending disability claim?',actions:[['YES','pendingYes','primary'],['NO','doctorScreen']]},
    pendingYes:{stage:'Disability Screening',title:'Disability Screening',text:'That is good to know. While waiting for that to be approved, let’s see if there are relief programs that can help lower your monthly expenses for now. Then proceed to DEBT SCRIPT.',next:'debtIntro'},
    doctorScreen:{stage:'Disability Screening',title:'Disability Screening',text:'Have you seen a doctor in the past 12 months for any of these conditions?',actions:[['If yes — Proceed to Screening','workHistory','primary'],['If No — Proceed to Debt Script','debtIntro']]},
    workHistory:{stage:'Disability Screening',title:'Disability Screening',text:'Ok, we are down to the last few questions, have you worked full time for at least 5 out of the last 10 years?',actions:[['YES — Proceed to Screening','lastYear','primary'],['NO — GO to DEBT SCRIPT','debtIntro']]},
    lastYear:{stage:'Disability Screening',title:'Disability Screening',text:'What year were you last employed?',next:'workKind'},
    workKind:{stage:'Disability Screening',title:'Disability Screening',text:'What kind of work did you do then?',next:'disabilityTransfer'},
    disabilityTransfer:{stage:'Disability Screening',title:'Disability Screening',text:'( Client name) I have great news ! Based on your current situation, you have an excellent case to qualify for disability benefits of up to $4100 per month. I will transfer you over to the case manager so we can get your benefits moving. Please hold while I connect you with a case manager.',next:'disabilityHandoff'},
    disabilityHandoff:{stage:'Disability Screening · Hand Off',title:'Disability Screening',text:'Hi , I have ( client name) on the line and he/she has been prequalified for the SSDI Program. Kindly take it from here.',finish:'Disability hand off'},
    debtIntro:{stage:'Debt / Tax Script',title:'Debt / Tax Script',text:'No worries, there are relief programs available to help lower your monthly expenses.\n\nLet me just confirm:',next:'debtAmount'},
    debtAmount:{stage:'Debt / Tax Script',title:'Debt / Tax Script',text:'How much debts from tax, credit card and personal loans are you struggling to pay?',actions:[['Qualified debt amount','qualifiedDebt','primary'],['Tax debt','taxDebt']]},
    qualifiedDebt:{stage:'Debt / Tax Script',title:'Debt / Tax Script',text:'Ok. The good news is based on your zip code and the information we have on file, you may qualify for debt relief program that can lower your monthly payment or eliminate these debts depending on your eligibility.',next:'debtPreTransfer'},
    taxDebt:{stage:'Debt / Tax Script',title:'Debt / Tax Script',text:'Ok. The good news is based on your zip code and the information we have on file, you may be eligible for possible tax deductions, credits, refunds or exemptions that you may have missed.',next:'debtPreTransfer'},
    debtPreTransfer:{stage:'Debt / Tax Script',title:'Debt / Tax Script',text:'I can connect you with a senior agent who can explain the program and check your eligibility. Would it be okay to place you on a brief hold while I transfer your call?',actions:[['Client agrees — Continue to hand off','debtHandoff','primary']]},
    debtHandoff:{stage:'Debt / Tax Script · Hand Off',title:'Debt / Tax Script',text:'Hi ! I have ( first name ) on the line and he/she is interested in the program. Kindly take if from here.',finish:'Debt / Tax hand off'},
    ttw:{stage:'Ticket to Work',title:'Ticket to Work',text:'That is good to know. Is the income you are receiving from SSDI enough for your monthly needs?',actions:[['IF INCOME IS ENOUGH','incomeEnough','primary'],['IF INCOME NOT ENOUGH','incomeNotEnough']]},
    incomeEnough:{stage:'Ticket to Work',title:'Ticket to Work',text:'that’s good to know! However if there is a program that can help you return to work without risking your monthly SSDI benefits? Would you be interested to learn more ?',actions:[['Interested','ttwInterested','primary'],['Not Interested — Go to Debt Script','debtIntro']]},
    ttwInterested:{stage:'Ticket to Work',title:'Ticket to Work',text:'Perfect, I will put you on quick hold as I transfer you over.',finish:'Ticket to Work transfer'},
    incomeNotEnough:{stage:'Ticket to Work',title:'Ticket to Work',text:'I feel you. But, (Client name), the great news is that , there is a program that can help you return to work without risking your monthly SSDI benefits to allow you earn a little bit more to cover your monthly needs. I can quickly transfer you to the specialist and they can walk you through the program. Is it ok if I put you on hold as I transfer you over?',finish:'Ticket to Work transfer'}
  };
  const order=Object.keys(steps);let current='name';let history=[];let visits=[];
  const $=id=>document.getElementById(id);
  function stageProgress(stage){const groups=['Opening & Verification','Disability Screening','Debt / Tax Script','Ticket to Work'];let idx=groups.indexOf(stage.split(' · ')[0]);return Math.max(1,idx+1)/groups.length*100;}
  function render(id){current=id;const s=steps[id];if(!s)return; $('scriptCard').classList.remove('hidden');$('doneCard').classList.add('hidden');$('pageTitle').textContent=s.title;$('stepChip').textContent=s.stage+' · Step '+(visits.length+1);$('stageName').textContent=s.stage;$('speaker').textContent=s.speaker||'AGENT';$('promptText').textContent=s.text;
    if(s.client){$('clientLine').classList.remove('hidden');$('clientText').textContent=s.client;}else{$('clientLine').classList.add('hidden');$('clientText').textContent='';}
    const actions=$('choices');actions.innerHTML='';$('actionLabel').textContent=s.actions?"Select the client\'s response":"Continue to the next part";
    if(s.actions){s.actions.forEach(([label,target,style])=>{const b=document.createElement('button');b.type='button';b.className='choice '+(style||'');b.textContent=label;b.addEventListener('click',()=>go(target));actions.appendChild(b);});}
    else if(s.next){const b=document.createElement('button');b.type='button';b.className='choice primary';b.textContent='Continue →';b.addEventListener('click',()=>go(s.next));actions.appendChild(b);}
    else if(s.finish){const b=document.createElement('button');b.type='button';b.className='choice primary';b.textContent='Finish Call';b.addEventListener('click',()=>finish(s.finish));actions.appendChild(b);}
    $('progressFill').style.width=stageProgress(s.stage)+'%';$('backButton').disabled=history.length===0;window.scrollTo({top:0,behavior:'smooth'});
  }
  function go(id){if(!steps[id])return;history.push(current);visits.push(id);render(id);}
  function back(){if(!history.length)return;const prev=history.pop();if(visits.length)visits.pop();render(prev);}
  function finish(label){$('scriptCard').classList.add('hidden');$('doneCard').classList.remove('hidden');$('doneTitle').textContent=label;$('doneText').textContent='';$('pageTitle').textContent=label;$('stepChip').textContent='Call flow complete';$('progressFill').style.width='100%';$('backButton').disabled=history.length===0;window.scrollTo({top:0,behavior:'smooth'});}
  function reset(){history=[];visits=[];render('name');}
  $('backButton').addEventListener('click',back);$('resetCall').addEventListener('click',reset);$('doneReset').addEventListener('click',reset);render('name');
})();
</script>
</body>
</html>
